[platformio]
extra_configs = platformio.local.ini

[blinds]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitc-02
framework = arduino
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D PIN_DIR=0
    -D PIN_STEP=1
    -D PIN_ENABLE=3
    -D PIN_LED=8
    -D PIN_UART_TX=4
    -D PIN_UART_RX=5
    -D PIN_SERVO=10
    -D TMC_RMS_CURRENT_MA=600
    -D TMC_MICROSTEPS=16
    -D MOTION_TIMER_HZ=50000
    -D STEP_PULSE_HIGH_US=20
    -D STEP_PULSE_LOW_US=20
    -D MAX_STEP_RATE=25000
    -D DEFAULT_SPEED=10000
    -D DEFAULT_ACCELERATION=100000
    -D DEFAULT_MAX_SPEED=25000
    -D DEFAULT_MAX_ACCELERATION=1000000

[env:esp32-c3-devkitc-02]
platform = ${blinds.platform}
board = ${blinds.board}
framework = ${blinds.framework}
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
build_flags = ${blinds.build_flags}
build_src_filter =
    +<*>
    -<web/>

[env:esp32-c3-web]
platform = ${blinds.platform}
board = ${blinds.board}
framework = ${blinds.framework}
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    ${blinds.build_flags}
    ${local.wifi_flags}
build_src_filter =
    +<*>
    -<main.cpp>
    -<stepper_tester.cpp>

[env:native]
platform = native
test_framework = unity
test_filter = test_web_core
build_flags =
    -std=gnu++17
